[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spfarm"
version = "2.0.0.dev1"
description = "SP-Farm V2 - Modern Desktop Operations Platform"
readme = "README.md"
authors = [{ name = "SP-Farm Engineering Team" }]
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.8.0",
    "SQLAlchemy>=2.0.30",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "cryptography>=44.0.0",
    "keyring>=25.6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
spfarm = "spfarm.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["spfarm"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
